name: Build & Release Desktop Apps

on:
  push:
    branches: [main, master]
    tags:
      - "v*"
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release Tag (e.g. v0.1.0)"
        required: false
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build on ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64 (Builds .exe installer and .msi package)
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
            name: "Windows-x64"

          # macOS Apple Silicon M1/M2/M3 (Builds .dmg and .app)
          - platform: "macos-latest"
            target: "aarch64-apple-darwin"
            name: "macOS-AppleSilicon"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.target }}

      - name: Install Frontend Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Desktop Application (Tauri Action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag || 'v0.1.0' }}
          releaseName: "گزارش‌گیر دسکتاپ ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag || 'v0.1.0' }}"
          releaseBody: |
            نسخه جدید نرم‌افزار گزارش‌گیر دسکتاپ (Gozareshgir Desktop)
            
            - پشتیبانی از سیستم‌عامل مک (macOS DMG & App) با طراحی ناچ بار تعاملی
            - پشتیبانی از ویندوز (Windows Setup EXE & MSI)
            - ورود سریع فقط با توکن
            - پشتیبانی از تمام فضاهای کاری و حالت Full Screen
          releaseDraft: true
          prerelease: false

      - name: Upload Artifacts (Downloadable from Actions Tab)
        uses: actions/upload-artifact@v4
        with:
          name: Gozareshgir-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
          if-no-files-found: warn
